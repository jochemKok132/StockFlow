# StockFlow on jochemkok.nl
# Include this inside the existing "server { listen 443 ssl; server_name jochemkok.nl; ... }" block
# (the one Certbot manages), next to the /vue location:
#     include /etc/nginx/snippets/stockflow.conf;

location = /stockflow/management {
    return 301 /stockflow/management/;
}

location /stockflow/management/ {
    proxy_pass http://127.0.0.1:5081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /stockflow/api/ {
    proxy_pass http://127.0.0.1:5080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}

